
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Rizzler</title>

    <link rel="stylesheet" href="./The_Rizzler.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Montserrat:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

</head>


<body>

    <script src="./PapaParse-5.0.2/papaparse.min.js"></script> 

    <main class="page">

        <!-- HEADER -->

        <header class="header">

            <h1 class="logo">
                The Rizzler
            </h1>

            <p class="tagline">
                YOUR TRANSLATOR FOR THE LANGUAGE<br>
                OF THE INTERNET
            </p>

        </header>


        <!-- SEARCH BAR -->

        <section class="search-section">

            <div class="button-decoration">

                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>


            <form id="searchForm" class="search-bar">

                <button
                    type="submit"
                    class="search-icon"
                    aria-label="Search"
                >

                    <span></span>

                </button>


                <input
                    type="text"
                    id="searchInput"
                    placeholder="search word or term"
                    autocomplete="off"
                >

            </form>


            <div class="button-decoration">

                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>

        </section>


        <!-- RANDOM WORD -->

        <section class="random-section">

            <button
                id="randomButton"
                class="random-button"
                type="button"
            >

                <span class="random-title">
                    Surprise me!
                </span>

                <span class="random-subtitle">
                    Generate a random slang word
                </span>

            </button>

        </section>

    </main>


    <script type="module", src="The_Rizzler.js"></script>

</body>

</html>
